<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
            display: none;
            margin-left: 10px;
        }

        .search {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #1f2937;
            color: white;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>STOCK MANAGEMENT SYSTEM</h1>
    <p>CRUD Inventory Management</p>
</header>

<div class="container">

    <div class="card">
        <h2 id="formTitle">Add Stock Item</h2>

        <form id="itemForm">

            <div class="form-grid">

                <input
                    type="text"
                    id="item_name"
                    placeholder="Item Name"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required
                >

                <input
                    type="number"
                    id="quantity"
                    placeholder="Quantity"
                    min="0"
                    required
                >

                <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    min="0"
                    step="0.01"
                    required
                >

                <input
                    type="text"
                    id="supplier"
                    placeholder="Supplier"
                    required
                >

            </div>

            <button type="submit" class="add-btn" id="submitBtn">
                Add Item
            </button>

            <button
                type="button"
                class="cancel-btn"
                id="cancelBtn"
                onclick="cancelEdit()"
            >
                Cancel
            </button>

        </form>

        <div id="message" class="message"></div>
    </div>


    <div class="card">

        <h2>Stock Items</h2>

        <input
            type="text"
            id="search"
            class="search"
            placeholder="Search item, category or supplier..."
            onkeyup="loadItems()"
        >

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Item Name</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Supplier</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="itemTable">
            </tbody>

        </table>

    </div>

</div>


<script>

    // Flask backend URL
    const API_URL = "http://127.0.0.1:5000/api/items";

    let editingId = null;


    // =========================
    // LOAD ITEMS
    // =========================

    async function loadItems() {

        try {

            const search =
                document.getElementById("search").value;

            const response =
                await fetch(
                    API_URL + "?search=" +
                    encodeURIComponent(search)
                );

            const items = await response.json();

            const table =
                document.getElementById("itemTable");

            table.innerHTML = "";


            items.forEach(item => {

                const row = document.createElement("tr");

                row.innerHTML = `

                    <td>${item.id}</td>

                    <td>${item.item_name}</td>

                    <td>${item.category}</td>

                    <td>${item.quantity}</td>

                    <td>₹${Number(item.price).toFixed(2)}</td>

                    <td>${item.supplier}</td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editItem(${item.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteItem(${item.id})"
                        >
                            Delete
                        </button>

                    </td>

                `;

                table.appendChild(row);

            });

        } catch (error) {

            showMessage(
                "Cannot connect to Flask backend.",
                "red"
            );

            console.error(error);

        }

    }


    // =========================
    // ADD / UPDATE
    // =========================

    document
        .getElementById("itemForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const item = {

                item_name:
                    document.getElementById("item_name").value,

                category:
                    document.getElementById("category").value,

                quantity:
                    Number(
                        document.getElementById("quantity").value
                    ),

                price:
                    Number(
                        document.getElementById("price").value
                    ),

                supplier:
                    document.getElementById("supplier").value

            };


            try {

                let response;


                if (editingId === null) {

                    // CREATE

                    response = await fetch(API_URL, {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(item)

                    });

                } else {

                    // UPDATE

                    response = await fetch(
                        API_URL + "/" + editingId,
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify(item)

                        }
                    );

                }


                const data = await response.json();


                if (!response.ok) {

                    showMessage(
                        data.error || "Something went wrong",
                        "red"
                    );

                    return;

                }


                if (editingId === null) {

                    showMessage(
                        "Item added successfully!",
                        "green"
                    );

                } else {

                    showMessage(
                        "Item updated successfully!",
                        "green"
                    );

                }


                resetForm();

                loadItems();


            } catch (error) {

                showMessage(
                    "Cannot connect to Flask backend.",
                    "red"
                );

                console.error(error);

            }

        });


    // =========================
    // EDIT
    // =========================

    async function editItem(id) {

        try {

            const response =
                await fetch(API_URL + "/" + id);

            const item =
                await response.json();


            if (!response.ok) {

                showMessage(
                    item.error || "Item not found",
                    "red"
                );

                return;

            }


            document.getElementById("item_name").value =
                item.item_name;

            document.getElementById("category").value =
                item.category;

            document.getElementById("quantity").value =
                item.quantity;

            document.getElementById("price").value =
                item.price;

            document.getElementById("supplier").value =
                item.supplier;


            editingId = id;


            document.getElementById("formTitle").innerText =
                "Update Stock Item";

            document.getElementById("submitBtn").innerText =
                "Update Item";

            document.getElementById("cancelBtn").style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


        } catch (error) {

            showMessage(
                "Cannot connect to Flask backend.",
                "red"
            );

        }

    }


    // =========================
    // DELETE
    // =========================

    async function deleteItem(id) {

        if (!confirm("Are you sure you want to delete this item?")) {
            return;
        }


        try {

            const response =
                await fetch(
                    API_URL + "/" + id,
                    {
                        method: "DELETE"
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                showMessage(
                    data.error || "Delete failed",
                    "red"
                );

                return;

            }


            showMessage(
                "Item deleted successfully!",
                "green"
            );


            loadItems();


        } catch (error) {

            showMessage(
                "Cannot connect to Flask backend.",
                "red"
            );

        }

    }


    // =========================
    // CANCEL EDIT
    // =========================

    function cancelEdit() {

        resetForm();

    }


    // =========================
    // RESET FORM
    // =========================

    function resetForm() {

        document.getElementById("itemForm").reset();

        editingId = null;


        document.getElementById("formTitle").innerText =
            "Add Stock Item";

        document.getElementById("submitBtn").innerText =
            "Add Item";

        document.getElementById("cancelBtn").style.display =
            "none";

    }


    // =========================
    // MESSAGE
    // =========================

    function showMessage(text, color) {

        const message =
            document.getElementById("message");

        message.innerText = text;

        message.style.color = color;


        setTimeout(() => {

            message.innerText = "";

        }, 3000);

    }


    // Load database items when page opens
    loadItems();

</script>

</body>
</html>
